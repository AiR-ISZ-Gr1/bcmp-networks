[project]
name = "bcmp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1.2",
    "pydantic>=2.9.2",
    "loguru>=0.7.2",
    "nanoid>=2.0.0",
    "streamlit>=1.39.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bcmp"]

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.29.5",
]
